<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Péndulo Doble Caótico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            color: white;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        main {
            flex: 1;
            display: flex;
            position: relative;
        }

        #canvas {
            flex: 1;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 280px;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }

        .controls h2 {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #667eea;
        }

        .control-group {
            margin-bottom: 1rem;
        }

        .control-group label {
            display: block;
            color: #555;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
            font-weight: 500;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #667eea;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #764ba2;
        }

        .value-display {
            display: inline-block;
            color: #667eea;
            font-weight: bold;
            margin-left: 0.5rem;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        button {
            flex: 1;
            padding: 0.7rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
        }

        .info-item {
            margin: 0.3rem 0;
            display: flex;
            justify-content: space-between;
            min-width: 200px;
        }

        .info-label {
            opacity: 0.8;
        }

        .info-value {
            font-weight: bold;
            color: #667eea;
        }

        .speed-indicator {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 0.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .controls {
                width: 240px;
                padding: 1rem;
            }

            h1 {
                font-size: 1.4rem;
            }

            .info-panel {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌌 PÉNDULO DOBLE CAÓTICO</h1>
    </header>
    
    <main>
        <canvas id="canvas"></canvas>
        
        <div class="controls">
            <h2>⚙️ Parámetros</h2>
            
            <div class="control-group">
                <label>Longitud Péndulo 1: <span class="value-display" id="l1-value">150</span> px</label>
                <input type="range" id="l1" min="50" max="200" value="150" step="5">
            </div>
            
            <div class="control-group">
                <label>Longitud Péndulo 2: <span class="value-display" id="l2-value">150</span> px</label>
                <input type="range" id="l2" min="50" max="200" value="150" step="5">
            </div>
            
            <div class="control-group">
                <label>Masa 1: <span class="value-display" id="m1-value">10</span> kg</label>
                <input type="range" id="m1" min="5" max="20" value="10" step="1">
            </div>
            
            <div class="control-group">
                <label>Masa 2: <span class="value-display" id="m2-value">10</span> kg</label>
                <input type="range" id="m2" min="5" max="20" value="10" step="1">
            </div>
            
            <div class="control-group">
                <label>Gravedad: <span class="value-display" id="g-value">9.8</span> m/s²</label>
                <input type="range" id="g" min="5" max="20" value="9.8" step="0.2">
            </div>
            
            <div class="control-group">
                <label>Amortiguamiento: <span class="value-display" id="damping-value">0.999</span></label>
                <input type="range" id="damping" min="0.99" max="1" value="0.999" step="0.001">
            </div>
            
            <div class="control-group">
                <label>
                    Velocidad de Animación: 
                    <span class="value-display" id="speed-value">1.0</span>x
                    <span class="speed-indicator" id="speed-indicator" style="display: none;">TURBO</span>
                </label>
                <input type="range" id="speed" min="0.1" max="15" value="1" step="0.1">
            </div>
            
            <div class="control-group">
                <label>Longitud del Rastro: <span class="value-display" id="trail-value">500</span></label>
                <input type="range" id="trail" min="100" max="1000" value="500" step="50">
            </div>
            
            <div class="button-group">
                <button onclick="resetPendulum()">🔄 Reiniciar</button>
                <button class="secondary" onclick="randomize()">🎲 Aleatorio</button>
            </div>
            
            <div class="button-group">
                <button onclick="togglePause()">⏸️ Pausar</button>
                <button class="secondary" onclick="clearTrail()">🧹 Limpiar Rastro</button>
            </div>
        </div>
        
        <div class="info-panel">
            <div class="info-item">
                <span class="info-label">Energía Total:</span>
                <span class="info-value" id="energy">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">FPS:</span>
                <span class="info-value" id="fps">60</span>
            </div>
            <div class="info-item">
                <span class="info-label">Tiempo:</span>
                <span class="info-value" id="time">0s</span>
            </div>
            <div class="info-item">
                <span class="info-label">Velocidad:</span>
                <span class="info-value" id="speed-info">1.0x</span>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let isPaused = false;
        let startTime = Date.now();
        let frameCount = 0;
        let lastFpsUpdate = Date.now();
        let currentFps = 60;
        
        // Parámetros del péndulo
        let l1 = 150, l2 = 150; // longitudes
        let m1 = 10, m2 = 10;   // masas
        let g = 9.8;            // gravedad
        let damping = 0.999;    // amortiguamiento
        let animationSpeed = 1.0; // velocidad de animación
        let trailLength = 500;  // longitud del rastro
        
        // Estado del péndulo
        let a1 = Math.PI / 2;   // ángulo 1
        let a2 = Math.PI / 2;   // ángulo 2
        let a1_v = 0;           // velocidad angular 1
        let a2_v = 0;           // velocidad angular 2
        
        // Rastro
        let trail = [];
        
        function resizeCanvas() {
            width = canvas.width = canvas.offsetWidth;
            height = canvas.height = canvas.offsetHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Ecuaciones del péndulo doble (método de Runge-Kutta 4)
        function pendulumDerivatives(state) {
            const [theta1, z1, theta2, z2] = state;
            
            const delta = theta2 - theta1;
            const den1 = (m1 + m2) * l1 - m2 * l1 * Math.cos(delta) * Math.cos(delta);
            const den2 = (l2 / l1) * den1;
            
            const num1 = -m2 * l1 * z1 * z1 * Math.sin(delta) * Math.cos(delta)
                      + m2 * g * Math.sin(theta2) * Math.cos(delta)
                      + m2 * l2 * z2 * z2 * Math.sin(delta)
                      - (m1 + m2) * g * Math.sin(theta1);
                      
            const num2 = -m2 * l2 * z2 * z2 * Math.sin(delta) * Math.cos(delta)
                      + (m1 + m2) * g * Math.sin(theta1) * Math.cos(delta)
                      - (m1 + m2) * l1 * z1 * z1 * Math.sin(delta)
                      - (m1 + m2) * g * Math.sin(theta2);
            
            return [z1, num1 / den1, z2, num2 / den2];
        }
        
        function rungeKutta4(state, dt) {
            const k1 = pendulumDerivatives(state);
            const k2 = pendulumDerivatives(state.map((s, i) => s + k1[i] * dt / 2));
            const k3 = pendulumDerivatives(state.map((s, i) => s + k2[i] * dt / 2));
            const k4 = pendulumDerivatives(state.map((s, i) => s + k3[i] * dt));
            
            return state.map((s, i) => s + (k1[i] + 2*k2[i] + 2*k3[i] + k4[i]) * dt / 6);
        }
        
        function updatePhysics(dt) {
            if (isPaused) return;
            
            // Aplicar velocidad de animación
            const adjustedDt = dt * animationSpeed;
            
            const state = [a1, a1_v, a2, a2_v];
            const newState = rungeKutta4(state, adjustedDt);
            
            [a1, a1_v, a2, a2_v] = newState;
            
            // Aplicar amortiguamiento
            a1_v *= damping;
            a2_v *= damping;
        }
        
        function calculateEnergy() {
            const x1 = l1 * Math.sin(a1);
            const y1 = l1 * Math.cos(a1);
            const x2 = x1 + l2 * Math.sin(a2);
            const y2 = y1 + l2 * Math.cos(a2);
            
            const v1x = l1 * a1_v * Math.cos(a1);
            const v1y = -l1 * a1_v * Math.sin(a1);
            const v2x = v1x + l2 * a2_v * Math.cos(a2);
            const v2y = v1y - l2 * a2_v * Math.sin(a2);
            
            const kinetic = 0.5 * m1 * (v1x*v1x + v1y*v1y) + 0.5 * m2 * (v2x*v2x + v2y*v2y);
            const potential = -m1 * g * y1 - m2 * g * y2;
            
            return kinetic + potential;
        }
        
        function draw() {
            // Limpiar canvas con efecto de desvanecimiento
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);
            
            const cx = width / 2;
            const cy = height / 2; // Eje fijo en el centro vertical
            
            // Calcular posiciones
            const x1 = cx + l1 * Math.sin(a1);
            const y1 = cy + l1 * Math.cos(a1);
            const x2 = x1 + l2 * Math.sin(a2);
            const y2 = y1 + l2 * Math.cos(a2);
            
            // Actualizar rastro
            trail.push({x: x2, y: y2});
            if (trail.length > trailLength) {
                trail.shift();
            }
            
            // Dibujar rastro
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            for (let i = 1; i < trail.length; i++) {
                const alpha = i / trail.length;
                const hue = (Date.now() / 50 + i * 2) % 360;
                ctx.strokeStyle = `hsla(${hue}, 70%, 60%, ${alpha * 0.8})`;
                ctx.beginPath();
                ctx.moveTo(trail[i-1].x, trail[i-1].y);
                ctx.lineTo(trail[i].x, trail[i].y);
                ctx.stroke();
            }
            
            // Dibujar barras
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            
            // Barra 1
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(x1, y1);
            ctx.stroke();
            
            // Barra 2
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            
            // Dibujar masas
            // Masa 1
            const gradient1 = ctx.createRadialGradient(x1, y1, 0, x1, y1, m1 * 2);
            gradient1.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient1.addColorStop(0.5, 'rgba(102, 126, 234, 0.8)');
            gradient1.addColorStop(1, 'rgba(102, 126, 234, 0.3)');
            
            ctx.fillStyle = gradient1;
            ctx.beginPath();
            ctx.arc(x1, y1, m1 * 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Masa 2
            const gradient2 = ctx.createRadialGradient(x2, y2, 0, x2, y2, m2 * 2);
            gradient2.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient2.addColorStop(0.5, 'rgba(118, 75, 162, 0.8)');
            gradient2.addColorStop(1, 'rgba(118, 75, 162, 0.3)');
            
            ctx.fillStyle = gradient2;
            ctx.beginPath();
            ctx.arc(x2, y2, m2 * 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Punto de pivote
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(cx, cy, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Actualizar información
            updateInfo();
        }
        
        function updateInfo() {
            frameCount++;
            const now = Date.now();
            
            if (now - lastFpsUpdate > 1000) {
                currentFps = frameCount;
                frameCount = 0;
                lastFpsUpdate = now;
            }
            
            document.getElementById('energy').textContent = calculateEnergy().toFixed(2) + ' J';
            document.getElementById('fps').textContent = currentFps;
            document.getElementById('time').textContent = ((now - startTime) / 1000).toFixed(1) + 's';
            document.getElementById('speed-info').textContent = animationSpeed.toFixed(1) + 'x';
        }
        
        function animate() {
            updatePhysics(0.01);
            draw();
            requestAnimationFrame(animate);
        }
        
        // Controladores
        function resetPendulum() {
            a1 = Math.PI / 2 + (Math.random() - 0.5) * 0.1;
            a2 = Math.PI / 2 + (Math.random() - 0.5) * 0.1;
            a1_v = 0;
            a2_v = 0;
            trail = [];
            startTime = Date.now();
        }
        
        function randomize() {
            l1 = 50 + Math.random() * 150;
            l2 = 50 + Math.random() * 150;
            m1 = 5 + Math.random() * 15;
            m2 = 5 + Math.random() * 15;
            g = 5 + Math.random() * 15;
            
            document.getElementById('l1').value = l1;
            document.getElementById('l2').value = l2;
            document.getElementById('m1').value = m1;
            document.getElementById('m2').value = m2;
            document.getElementById('g').value = g;
            
            updateSliderValues();
            resetPendulum();
        }
        
        function togglePause() {
            isPaused = !isPaused;
            event.target.textContent = isPaused ? '▶️ Reanudar' : '⏸️ Pausar';
        }
        
        function clearTrail() {
            trail = [];
        }
        
        function updateSliderValues() {
            document.getElementById('l1-value').textContent = Math.round(l1);
            document.getElementById('l2-value').textContent = Math.round(l2);
            document.getElementById('m1-value').textContent = Math.round(m1);
            document.getElementById('m2-value').textContent = Math.round(m2);
            document.getElementById('g-value').textContent = g.toFixed(1);
            document.getElementById('damping-value').textContent = damping.toFixed(3);
            document.getElementById('speed-value').textContent = animationSpeed.toFixed(1);
            document.getElementById('trail-value').textContent = trailLength;
            
            // Mostrar indicador TURBO para altas velocidades
            const speedIndicator = document.getElementById('speed-indicator');
            if (animationSpeed >= 5) {
                speedIndicator.style.display = 'inline-block';
                speedIndicator.textContent = animationSpeed >= 10 ? 'ULTRA TURBO' : 'TURBO';
            } else {
                speedIndicator.style.display = 'none';
            }
        }
        
        // Event listeners para controles
        document.getElementById('l1').addEventListener('input', (e) => {
            l1 = parseFloat(e.target.value);
            updateSliderValues();
        });
        
        document.getElementById('l2').addEventListener('input', (e) => {
            l2 = parseFloat(e.target.value);
            updateSliderValues();
        });
        
        document.getElementById('m1').addEventListener('input', (e) => {
            m1 = parseFloat(e.target.value);
            updateSliderValues();
        });
        
        document.getElementById('m2').addEventListener('input', (e) => {
            m2 = parseFloat(e.target.value);
            updateSliderValues();
        });
        
        document.getElementById('g').addEventListener('input', (e) => {
            g = parseFloat(e.target.value);
            updateSliderValues();
        });
        
        document.getElementById('damping').addEventListener('input', (e) => {
            damping = parseFloat(e.target.value);
            updateSliderValues();
        });
        
        document.getElementById('speed').addEventListener('input', (e) => {
            animationSpeed = parseFloat(e.target.value);
            updateSliderValues();
        });
        
        document.getElementById('trail').addEventListener('input', (e) => {
            trailLength = parseInt(e.target.value);
            updateSliderValues();
        });
        
        // Iniciar animación
        animate();
    </script>
</body>
</html>
